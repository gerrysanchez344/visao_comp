<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Inspeção de Qualidade</title>
  <!-- Biblioteca Paho MQTT para o navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #eef2f5;
      padding-top: 60px;
    }
    .card {
      display: inline-block;
      width: 380px;
      padding: 30px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    h2 {
      color: #333;
      margin-bottom: 5px;
    }
    p {
      color: #666;
      font-size: 14px;
    }
    .status-box {
      font-size: 22px;
      font-weight: bold;
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      color: white;
      background-color: #6c757d;
      transition: all 0.3s ease;
    }
    .quadrado { 
      background-color: #28a745; 
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
    }
    .outro { 
      background-color: #dc3545; 
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Inspeção de Peças</h2>
    <p>Monitoramento IoT via HiveMQ WebSocket</p>
    <div id="status" class="status-box">Aguardando câmera...</div>
  </div>

  <script>
    // Conexão WSS (WebSocket Seguro) com o HiveMQ na porta 8884
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_client_" + Math.random());

    client.onConnectionLost = function (responseObject) {
      console.log("Conexão perdida: " + responseObject.errorMessage);
    };

    client.onMessageArrived = function (message) {
      const statusDiv = document.getElementById("status");
      const valor = message.payloadString;

      if (valor === "QUADRADO") {
        statusDiv.innerText = "Peça Quadrada";
        statusDiv.className = "status-box quadrado";
      } else {
        statusDiv.innerText = "Outra Peça / Ausente";
        statusDiv.className = "status-box outro";
      }
    };

    // Activa useSSL: true para funcionar no GitHub Pages (HTTPS)
    client.connect({
      useSSL: true,
      onSuccess: function () {
        console.log("Conectado com sucesso ao Broker HiveMQ via Secure WebSocket!");
        client.subscribe("escola/inspecao/geometria");
      },
      onFailure: function (error) {
        console.log("Falha ao conectar: " + error.errorMessage);
      }
    });
  </script>
</body>
</html>
